version: "3.8"

services:
  multiplayer-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
    volumes:
      # Development mounts to iterate quickly on multiplayer backend logic.
      - ./server:/app/server
      - ./shared:/app/shared
      - ./core:/app/core
    command: npm run start:server
